aid: volt-io
url: https://raw.githubusercontent.com/api-evangelist/volt-io/refs/heads/main/apis.yml
name: Volt
kind: company
description: >-
  Volt is a London-headquartered real-time payments company that operates a
  global account-to-account (A2A) "pay by bank" network built on open banking
  rails. Founded in 2019, Volt connects merchants to bank-initiated payments
  across the UK (Faster Payments / Open Banking under PSD2), Europe (SEPA),
  Brazil (Pix), Australia (PayTo), and other real-time schemes through a single
  API, so shoppers pay directly from their bank account without cards. Its
  platform spans payment initiation, refunds, payouts, recurring payments
  (mandates / variable recurring payments), Volt Accounts and virtual IBANs for
  settlement and collections, account verification (confirmation of payee), and
  reconciliation reporting. Volt sells to merchants and PSPs across ecommerce,
  travel, gaming, iGaming and financial services, and is FCA-authorised in its
  home market of the United Kingdom. Volt ships a genuine, API-native developer
  surface: a public developer portal and OpenAPI-backed API reference at
  docs.volt.io, a single production gateway host (gateway.volt.io) with a
  sandbox, OAuth2 authentication, and webhooks for asynchronous payment events.
  The docs.volt.io API reference renders schemas server-side, but Volt publishes
  a real OpenAPI 3.0.1 definition for its Accounts API (virtual IBANs, named
  accounts, settlement) in the github.com/volt-io/volt-io-accounts repository,
  and ships first-party mobile checkout SDKs (iOS/Android) plus e-commerce
  plugins in the same GitHub organization.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
